name: Trigger Deploy

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy token is present
        run: |
          if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "DEPLOY_TOKEN is not set. The API deploy cannot be triggered." >&2
            exit 1
          fi

      - name: Note the newest existing deploy run
        id: before
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          id=$(gh run list --repo ${{ github.repository_owner }}/money-manage-api \
            --workflow deploy.yml --event workflow_dispatch --limit 1 \
            --json databaseId --jq '.[0].databaseId // 0')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # --fail-with-body makes a rejected dispatch fail the job instead of
      # passing silently: plain curl exits 0 on a 401, so an expired token
      # used to look like a successful deploy while nothing was deployed.
      - name: Trigger API deploy workflow
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/money-manage-api/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'

      # A 204 only means the dispatch was accepted, so wait for the run itself
      # to appear. Without this the job can still go green having deployed
      # nothing.
      - name: Confirm a new deploy run started
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          for _ in $(seq 1 30); do
            id=$(gh run list --repo ${{ github.repository_owner }}/money-manage-api \
              --workflow deploy.yml --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0')
            if [ "$id" != "${{ steps.before.outputs.id }}" ]; then
              echo "API deploy run $id started."
              exit 0
            fi
            sleep 5
          done
          echo "The dispatch was accepted but no new deploy run appeared." >&2
          exit 1
