services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-money123}
      MYSQL_DATABASE: ${DB_NAME:-money_manage}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Every DB_* value comes from .env — no defaults. A missing variable must
      # fail loudly rather than silently fall back to the retired local MySQL.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      GIN_MODE: release
      STATIC_DIR: ./dist
    volumes:
      - ./apps/web/dist:/app/dist:ro
    depends_on:
      db:
        condition: service_healthy

  # One-shot MySQL -> Postgres data copy. Behind a profile so it never starts
  # with `docker compose up`; run it with:
  #   docker compose --profile tools run --rm migrate
  # It needs the db service present so the MySQL host in MYSQL_DSN resolves.
  migrate:
    build: ./apps/api
    profiles: ["tools"]
    command: ["./server", "migrate"]
    environment:
      MYSQL_DSN: ${MYSQL_DSN}
      DB_HOST: ${DB_HOST}
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: postgres
      DB_SSLMODE: require

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  mysql_data:
